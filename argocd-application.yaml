apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: securecloud
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/teja-reddy43/securecloud-devsecops.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: securecloud
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=false
