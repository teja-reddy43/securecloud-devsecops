
apiVersion: apps/v1
kind: Deployment
metadata:
  name: securecloud-api
  namespace: securecloud
  labels:
    app.kubernetes.io/name: securecloud-api
    app.kubernetes.io/part-of: securecloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: securecloud-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: securecloud-api
        app.kubernetes.io/part-of: securecloud
    spec:
      serviceAccountName: securecloud-reader
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: securecloud-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: securecloud-config
            - secretRef:
                name: securecloud-secret
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
