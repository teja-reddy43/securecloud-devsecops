apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: securecloud-api-ingress
  namespace: securecloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: securecloud-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: securecloud-client
      ports:
        - protocol: TCP
          port: 8000